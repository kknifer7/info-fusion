services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: info-fusion
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - env/.env.prod
    environment:
      # 如有需要，可在此覆盖环境变量，例如：
      # DEEPSEEK_API_KEY: your-api-key-here
      - NODE_ENV=production
    volumes:
      # 持久化 SQLite 数据库文件
      - ./data:/app/data
      # 挂载爬虫脚本目录（宿主机放 .py 脚本和 requirements.txt）
      - ./crawlers:/app/crawlers
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
